<style>
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Roboto+Mono:wght@300;400&display=swap');

    :root {
        --accent: #00ffcc;
        --bg: #050505;
        --surface: #121212;
    }

    body { 
        font-family: 'Roboto Mono', monospace; 
        background: var(--bg); 
        background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        color: #d1d1d1; 
        text-align: center; 
        padding: 40px 20px; 
        margin: 0;
    }

    /* Subtle CRT Scanline Effect */
    body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                    linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
    }

    .container { 
        max-width: 800px; 
        margin: auto; 
        position: relative;
        z-index: 3;
    }

    h1 { 
        font-family: 'Syncopate', sans-serif;
        color: #fff; 
        letter-spacing: 8px; 
        text-transform: uppercase; 
        font-size: 2.5rem;
        margin-bottom: 0;
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .sub-header { 
        color: var(--accent); 
        font-size: 0.8rem; 
        margin-bottom: 40px; 
        letter-spacing: 4px;
        text-transform: uppercase;
    }

    .card {
        background: var(--surface);
        border: 1px solid #222;
        padding: 30px;
        border-radius: 4px;
        margin-bottom: 20px;
        transition: border-color 0.3s ease;
    }

    .card:hover {
        border-color: var(--accent);
    }

    .links a { 
        color: #fff; 
        text-decoration: none; 
        display: block; 
        margin: 10px 0; 
        padding: 15px; 
        background: rgba(255,255,255,0.03);
        border-radius: 2px;
        transition: all 0.2s ease;
        border-left: 0 solid var(--accent);
    }

    .links a:hover { 
        background: rgba(0, 255, 204, 0.1); 
        color: var(--accent);
        border-left: 4px solid var(--accent);
        padding-left: 20px;
    }

    .embed-container {
        margin: 30px 0;
        filter: grayscale(1) contrast(1.2); /* Makes players match the site aesthetic */
        transition: filter 0.3s ease;
    }

    .embed-container:hover {
        filter: grayscale(0);
    }

    .footer { 
        margin-top: 60px; 
        font-size: 0.7rem; 
        color: #444; 
        text-transform: uppercase;
        letter-spacing: 2px;
    }
</style>
