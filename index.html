<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>The Stoa Group | Independent Music Label & Production House</title>
    <meta name="description" content="Official website of The Stoa Group. Independent record label with hubs in SF, Orlando, and Seattle.">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicReleaseLabel",
      "name": "The Stoa Group",
      "url": "https://thestoagroup.com",

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Roboto+Mono:wght@300;400&display=swap');
        :root { --accent: #00ffcc; --bg: #050505; --surface: #121212; }
        
        body { 
            font-family: 'Roboto Mono', monospace; background: var(--bg); color: #d1d1d1; text-align: center; margin: 0; padding: 40px 20px;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        .container { max-width: 800px; margin: auto; position: relative; z-index: 2; }
        
        /* CRT Effect Overlay */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        h1 { font-family: 'Syncopate', sans-serif; color: #fff; letter-spacing: 6px; text-transform: uppercase; font-size: 2rem; margin-bottom: 5px; }
        .sub-header { color: var(--accent); font-size: 0.7rem; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }

        /* Hero Image Styling */
        .cover-art {
            width: 100%; max-width: 400px; height: auto; border-radius: 4px; border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px; transition: transform 0.3s ease;
        }
        .cover-art:hover { transform: scale(1.02); border-color: var(--accent); }

        .current-release { background: var(--surface); border: 1px solid #222; padding: 40px; border-radius: 4px; margin-bottom: 30px; }
        
        /* Player Styling */
        .player-container { margin: 20px 0; border-radius: 12px; overflow: hidden; background: #000; }

        .links a { 
            color: #fff; text-decoration: none; display: block; margin: 12px 0; padding: 18px; 
            background: rgba(255,255,255,0.03); border: 1px solid #222; transition: all 0.2s ease;
        }
        .links a:hover { background: rgba(0, 255, 204, 0.05); color: var(--accent); border-color: var(--accent); }

        .footer { margin-top: 80px; font-size: 0.65rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE STOA GROUP</h1>
        <div class="sub-header">San Francisco • Orlando • Seattle</div>

        <div class="current-release">
            <p style="font-size: 0.7rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px;">LATEST RELEASE</p>
            
            <img src="sounds-of-io.jpg" alt="Sounds of IO Cover Art" class="cover-art">
            
            <h2 style="color: #fff; margin-bottom: 10px;">SOUNDS OF IO</h2>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 25px;">Standalone single by <span style="color: #fff;">Transcribe</span></p>

            <div class="player-container">
                <iframe src="https://open.spotify.com/embed/track/YOUR_TRACK_ID?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>

        <div class="links">
            <a href="https://linktr.ee/transcribe_music" target="_blank">STREAM / DOWNLOAD</a>
            <a href="https://www.twitch.tv/thestoagroup" target="_blank">TWITCH (LIVE SESSIONS)</a>
            <a href="https://musicbrainz.org/label/dad94a2f-24f2-4001-95c1-bff5a3e5435d" target="_blank">LABEL CATALOG</a>
        </div>

        <div class="footer">
            © 2026 THE STOA GROUP | SF • ORLANDO • SEATTLE
        </div>
    </div>

</body>
</html>
