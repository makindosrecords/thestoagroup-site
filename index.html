    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Roboto+Mono:wght@300;400&display=swap');

        :root {
            --accent: #00ffcc;
            --bg: #050505;
            --surface: #121212;
        }

        body { 
            font-family: 'Roboto Mono', monospace; 
            background: var(--bg); 
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: #d1d1d1; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
        }

        /* Subtle CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .container { 
            max-width: 800px; 
            margin: auto; 
            position: relative;
            z-index: 20;
        }

        h1 { 
            font-family: 'Syncopate', sans-serif;
            color: #fff; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .sub-header { 
            color: var(--accent); 
            font-size: 0.75rem; 
            margin-bottom: 40px; 
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .current-release {
            background: var(--surface);
            border: 1px solid #222;
            padding: 35px;
            border-radius: 4px;
            margin-bottom: 30px;
            transition: border-color 0.4s ease;
        }

        .current-release:hover {
            border-color: var(--accent);
        }

        .release-tag {
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .release-title {
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .links a { 
            color: #fff; 
            text-decoration: none; 
            display: block; 
            margin: 12px 0; 
            padding: 18px; 
            background: rgba(255,255,255,0.03);
            border: 1px solid #222;
            border-radius: 2px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .links a:hover { 
            background: rgba(0, 255, 204, 0.05); 
            color: var(--accent);
            border-color: var(--accent);
            padding-left: 25px;
        }

        .footer { 
            margin-top: 80px; 
            font-size: 0.65rem; 
            color: #444; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
